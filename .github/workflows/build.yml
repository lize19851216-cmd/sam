name: SAM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\SAM.slnx -r win-x64

      - name: Build
        run: dotnet build .\SAM.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\tests\SAM.Core.Tests\SAM.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=sam-tests.trx" --results-directory .\TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAM-test-results
          path: TestResults/sam-tests.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Windows x64
        run: dotnet publish .\src\SAM.Desktop\SAM.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o .\artifacts\SAM

      - name: Publish Steam authentication broker Windows x64
        run: dotnet publish .\src\SAM.SteamBroker\SAM.SteamBroker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o .\artifacts\SAM.SteamBroker

      - name: Generate artifact checksums
        shell: pwsh
        run: |
          Get-ChildItem .\artifacts -Recurse -File | Where-Object Name -ne SHA256SUMS.txt |
            Get-FileHash -Algorithm SHA256 |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash) *$($_.Path.Substring((Resolve-Path .\artifacts).Path.Length + 1).Replace('\\', '/'))" } |
            Set-Content .\artifacts\SHA256SUMS.txt

      - name: Upload SAM
        uses: actions/upload-artifact@v4
        with:
          name: SAM-win-x64
          path: artifacts/SAM/

      - name: Upload Steam authentication broker
        uses: actions/upload-artifact@v4
        with:
          name: SAM-SteamBroker-win-x64
          path: artifacts/SAM.SteamBroker/

      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: SAM-win-x64-checksums
          path: artifacts/SHA256SUMS.txt
